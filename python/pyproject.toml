[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "adjacent-python"
version = "0.2.3"
description = "Python bindings and interactive CAD tools for Adjacent"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "Adjacent contributors" }]

[project.scripts]
adjacent-cad = "adjacent.cad:main"
adjacent-demo = "adjacent.demo:rectangle_main"
adjacent-bezier-demo = "adjacent.demo:bezier_main"
adjacent-font-editor = "adjacent.font_editor:main"
adjacent-pelican-demo = "adjacent.pelican_demo:main"
adjacent-hyperbezier-demo = "adjacent.hyperbezier_demo:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["adjacent"]
