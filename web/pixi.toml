[workspace]
name = "adjacent-web"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
emscripten = ">=4.0,<4.1"
cmake = ">=3.20"
ninja = "*"
xtensor = ">=0.24,<0.26"
python = ">=3.10"

[tasks.configure]
cmd = "emcmake cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -Dxtensor_DIR=$CONDA_PREFIX/share/cmake/xtensor -Dxtl_DIR=$CONDA_PREFIX/share/cmake/xtl"

[tasks.build]
cmd = "cmake --build build"
depends-on = ["configure"]

[tasks.serve]
cmd = "python -m http.server 8000 -d ."
depends-on = ["build"]
