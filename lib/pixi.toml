[workspace]
name = "libadjacent"
channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[package]
name = "libadjacent"
version = "0.2.0"
description = "C++17 symbolic 2D geometric constraint solver"
license = "GPL-3.0-or-later"
license-file = "LICENSE"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.4.*"
channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]

[package.build.config]
extra-args = ["-DBUILD_TESTING=OFF"]

[package.host-dependencies]
xtensor = ">=0.24,<0.26"

[package.run-dependencies]
xtensor = ">=0.24,<0.26"

[dependencies]
cmake = ">=3.16"
cxx-compiler = "*"
ninja = "*"
xtensor = ">=0.24,<0.26"

[tasks.configure]
cmd = "cmake -S . -B build -GNinja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug"

[tasks.build]
cmd = "cmake --build build"
depends-on = ["configure"]

[tasks.test]
cmd = "ctest --test-dir build --output-on-failure"
depends-on = ["build"]
