[workspace]
name = "adjacent-workspace"
authors = ["Adjacent contributors"]
description = "Development workspace for the Adjacent C++ solver and Python CAD tools"
channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[workspace.dependencies]
libadjacent = { path = "lib" }
adjacent-python = { path = "python" }
python = ">=3.9"
tk = "*"

[dependencies]
adjacent-python = { workspace = true }

[tasks.font-editor]
cmd = "adjacent-font-editor"
description = "Launch the SVG and font outline editor"

[tasks.cad]
cmd = "adjacent-cad"
description = "Launch the interactive CAD editor"

[tasks.demo]
cmd = "adjacent-demo"
description = "Launch the constrained rectangle demo"

[tasks.demo-bezier]
cmd = "adjacent-bezier-demo"
description = "Launch the cubic Bézier demo"

[tasks.demo-pelican]
cmd = "adjacent-pelican-demo"
description = "Launch the draggable constrained pelican bicycle demo"

[tasks.demo-hyperbezier]
cmd = "adjacent-hyperbezier-demo"
description = "Launch the experimental G2 hyperbezier auto-spline demo"

[tasks.test-python]
cmd = "python -m unittest discover -s python/tests -v"

[tasks.test-cpp]
cmd = "pixi run --manifest-path lib/pixi.toml test"

[tasks.test]
depends-on = ["test-cpp", "test-python"]

[tasks.web-build]
cmd = "pixi run --manifest-path web/pixi.toml build"

[tasks.web-serve]
cmd = "pixi run --manifest-path web/pixi.toml serve"

[tasks.build-packages]
cmd = "pixi publish --path lib --target-dir dist && pixi publish --path python --target-dir dist"
